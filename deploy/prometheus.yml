# Prometheus configuration for GoBalance local development.
# Scrapes the admin endpoint every 2 seconds.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: gobalance
    # host.docker.internal resolves to the host machine from inside Docker.
    # If you're on Linux without Docker Desktop, use your LAN IP instead.
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: /metrics
